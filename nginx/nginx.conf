events { worker_connections 1024; }

http {
  client_max_body_size 50M;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript
             application/vnd.ms-fontobject font/opentype image/svg+xml;
  gzip_min_length 256;
  gzip_comp_level 5;
  gzip_proxied any;
  gzip_vary on;

  # Rate limiting zones (burst sized for page-load bursts: ~20 simultaneous PB calls)
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

  # ── HTTP → HTTPS redirect (uncomment when TLS certs are in place) ──────────
  # server {
  #   listen 80;
  #   server_name _;
  #   return 301 https://$host$request_uri;
  # }

  # ── Main server ────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options          "DENY"                           always;
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection         "1; mode=block"                  always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # PocketBase API + Admin
    location /pb/ {
      limit_req zone=api burst=60 nodelay;

      proxy_pass         http://pocketbase:8090/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $http_host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
    }

    # Next.js app
    location / {
      limit_req zone=general burst=100 nodelay;

      proxy_pass         http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $http_host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
    }
  }

  # ── HTTPS server (uncomment and place certs at TLS_CERT_PATH) ─────────────
  # server {
  #   listen 443 ssl http2;
  #   server_name _;
  #
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         HIGH:!aNULL:!MD5;
  #   ssl_session_cache   shared:SSL:10m;
  #   ssl_session_timeout 1d;
  #
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #   add_header X-Frame-Options          "DENY"                            always;
  #   add_header X-Content-Type-Options   "nosniff"                         always;
  #   add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
  #
  #   location /pb/ {
  #     limit_req zone=api burst=20 nodelay;
  #     proxy_pass         http://pocketbase:8090/;
  #     proxy_http_version 1.1;
  #     proxy_set_header   Host              $http_host;
  #     proxy_set_header   X-Real-IP         $remote_addr;
  #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  #     proxy_set_header   Upgrade           $http_upgrade;
  #     proxy_set_header   Connection        "upgrade";
  #   }
  #
  #   location / {
  #     limit_req zone=general burst=50 nodelay;
  #     proxy_pass         http://web:3000;
  #     proxy_http_version 1.1;
  #     proxy_set_header   Host              $http_host;
