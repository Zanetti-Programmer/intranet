services:

  # ── PocketBase — backend (auth + DB + realtime + storage) ──────────────────
  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    container_name: intranet_pb
    restart: unless-stopped
    environment:
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-admin@empresa.com}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-Admin@2024}
    volumes:
      - pb_data:/pb/pb_data
    networks:
      - intranet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Next.js — frontend ─────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: intranet_web
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_PB_URL: ${NEXT_PUBLIC_PB_URL:-http://localhost/pb}
    networks:
      - intranet

  # ── nginx — proxy reverso ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: intranet_proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_PATH:-./nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      - web
      - pocketbase
    networks:
      - intranet

  # ── Backup automático — SQLite via PocketBase API às 2h ────────────────────
  backup:
    image: alpine:3.19
    container_name: intranet_backup
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-admin@empresa.com}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-Admin@2024}
      PB_URL: http://pocketbase:8090
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - pb_backups:/backups
    networks:
      - intranet
    entrypoint: >
      sh -c "apk add --no-cache wget curl &&
             echo '0 2 * * * sh /backup.sh >> /var/log/backup.log 2>&1' | crontab - &&
             crond -f -l 8"

volumes:
  pb_data:
  pb_backups:

networks:
  intranet:
    driver: bridge
